name: Release

# A pull request that bumps a released crate's version is checked for
# consistency and publishability. Pushing a <crate>-<version> tag verifies
# the tag, waits for CI at that commit, then publishes the crate to
# crates.io through the `release` environment (required reviewer) with
# keyless OIDC, cuts the GitHub release, and confirms the upload.

on:
  pull_request:
    paths:
      - ohttp/Cargo.toml
  push:
    tags:
      - 'bitcoin-ohttp-[0-9]*'

permissions:
  contents: read

jobs:
  check-bump:
    name: Check ${{ matrix.crate }} version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [bitcoin-ohttp, bhttp]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Use cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check the bump is consistent and publishable
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./contrib/release/check-bump.sh "${{ matrix.crate }}" "$BASE_SHA"

  verify-tag:
    name: Verify release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      crate: ${{ steps.meta.outputs.crate }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Compute tag metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          source contrib/release/crates.sh
          crate="$(crate_from_tag "$TAG")"
          version="$(version_from_tag "$TAG")"
          {
            echo "crate=$crate"
            echo "version=$version"
            is_prerelease "$version" && echo "prerelease=true" || echo "prerelease=false"
          } >>"$GITHUB_OUTPUT"
      - name: Verify tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./contrib/release/verify-tag.sh "$TAG"

  wait-for-ci:
    name: Wait for CI
    if: github.event_name == 'push'
    needs: verify-tag
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    steps:
      # Wait only for the correctness checks (check.yml) at the tagged
      # commit. Scoping by regexp avoids waiting on this workflow's own
      # downstream publish jobs, which would deadlock.
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.9.0
        with:
          ref: ${{ github.sha }}
          check-regexp: ^Continuous
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push'
    needs: [verify-tag, wait-for-ci]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
      CRATE: ${{ needs.verify-tag.outputs.crate }}
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Use cache
        uses: Swatinem/rust-cache@v2
      - name: Package the crate
        run: cargo package -p "$CRATE"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/package/${{ env.CRATE }}-${{ env.VERSION }}.crate
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "$CRATE"
      - name: Upload packaged crate
        uses: actions/upload-artifact@v4
        with:
          name: crate
          path: target/package/${{ env.CRATE }}-${{ env.VERSION }}.crate

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: [verify-tag, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged crate
        uses: actions/download-artifact@v4
        with:
          name: crate
          path: dist
      - name: Generate SHA256SUMS
        run: (cd dist && sha256sum ./*.crate >SHA256SUMS)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.verify-tag.outputs.prerelease }}
          files: |
            dist/*.crate
            dist/SHA256SUMS

  verify-published:
    name: Verify publication
    if: github.event_name == 'push'
    needs: [verify-tag, publish]
    runs-on: ubuntu-24.04
    env:
      CRATE: ${{ needs.verify-tag.outputs.crate }}
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download packaged crate
        uses: actions/download-artifact@v4
        with:
          name: crate
          path: dist
      - name: Verify crates.io and docs.rs
        run: ./contrib/release/verify-published.sh "$CRATE" "$VERSION" "dist/$CRATE-$VERSION.crate"
