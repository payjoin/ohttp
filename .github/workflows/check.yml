name: CI
on:
  push:
    branches: ["main"]
    paths-ignore: ["*.md", "LICENSE-*"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["*.md", "LICENSE-*"]
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# This fork ships the rust-hpke backend with the secp256k1 DHKEM from bitcoin-hpke.
#
# Not in the matrix, on purpose:
# - nss: NSS has no secp256k1 DHKEM, and the backend has not compiled since the Kem
#   enum was pruned to K256Sha256 (bac8f2c). Drop or delete is a separate decision.

jobs:
  check:
    name: Continuous Integration (rust-hpke)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Build
        run: cargo build --tests --no-default-features --features rust-hpke,client,server

      - name: Run Tests
        run: cargo test --no-default-features --features rust-hpke,client,server

      - name: Check formatting
        if: ${{ success() || failure() }}
        run: cargo fmt --all -- --check --config imports_granularity=Crate

      - name: Clippy
        if: ${{ success() || failure() }}
        run: cargo clippy --tests --no-default-features --features rust-hpke,client,server
